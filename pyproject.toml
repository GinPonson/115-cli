[project]
name = "u115-uploader"
version = "0.1.0"
description = "115 网盘开放平台二维码登录与文件上传 CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[socks]>=0.28",
    "oss2>=2.19",
    "pillow>=11.0",
    "qrcode>=8.2",
]

[project.scripts]
u115 = "u115_uploader.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/u115_uploader"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
